<!DOCTYPE html>
<html lang="en" data-theme="{{ ui_theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Jukebox — TV Display</title>
  <link rel="stylesheet" href="/static/css/jukebox.css">
  <link id="classic-css" rel="stylesheet" href="/static/css/classic.css"{% if ui_theme != 'classic' %} disabled{% endif %}>
  <style>
    body {
      overflow: hidden;
      cursor: none;
      background: var(--bg);
    }
    body::after {
      content: 'CLICK FOR FULLSCREEN';
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 0.6rem;
      color: rgba(43,32,22,0.22);
      pointer-events: none;
      letter-spacing: 2px;
      z-index: 10000;
    }
    [data-theme="classic"] body::after { color: rgba(255,255,255,0.15); }
  </style>
</head>
<body>

<div class="tv-dash">

  <!-- ── Top: Party stats bar ── -->
  <div class="tv-statbar">
    <div class="tv-stat">
      <div id="tv-stat-songs" class="tv-stat-num">0</div>
      <div class="tv-stat-label">Songs Played</div>
    </div>
    <div class="tv-stat">
      <div id="tv-stat-guests" class="tv-stat-num">0</div>
      <div class="tv-stat-label">Guests</div>
    </div>
    <div class="tv-stat">
      <div id="tv-stat-reactions" class="tv-stat-num">0</div>
      <div class="tv-stat-label">Reactions</div>
    </div>
    <div class="tv-stat">
      <div id="tv-stat-runtime" class="tv-stat-num">—</div>
      <div class="tv-stat-label">Party Runtime</div>
    </div>
  </div>

  <!-- ── Center-left: Now Playing ── -->
  <div class="tv-dash-now">

    <!-- Corner decoration -->
    <div class="tv-wordmark">Party Jukebox</div>

    <!-- Live reaction feed overlay -->
    <div id="tv-reaction-feed" class="tv-reaction-feed"></div>

    <!-- No track message -->
    <div id="tv-no-track" class="tv-no-track">
      <div class="tv-no-track-title">Jukebox</div>
      <div class="tv-no-track-sub">Queue a Song to Get the Party Started</div>
    </div>

    <!-- Now Playing section -->
    <div id="tv-playing-section" class="hidden tv-playing-section">

      <!-- Vinyl + Album art -->
      <div class="tv-vinyl-wrap">
        <svg id="tv-vinyl" class="tv-vinyl" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#0d0d0d" stroke="#222" stroke-width="1"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
          <circle cx="50" cy="50" r="36" fill="none" stroke="#1a1a1a" stroke-width="1"/>
          <circle cx="50" cy="50" r="32" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
          <circle cx="50" cy="50" r="28" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
          <circle class="vinyl-label" cx="50" cy="50" r="14" fill="#c1573a"/>
          <circle class="vinyl-label-ring" cx="50" cy="50" r="14" fill="none" stroke="rgba(107,122,63,0.6)" stroke-width="1.5"/>
          <circle class="vinyl-hole" cx="50" cy="50" r="3.5" fill="#f5efe1"/>
          <circle class="vinyl-rim" cx="50" cy="50" r="48" fill="none" stroke="rgba(107,122,63,0.25)" stroke-width="2"/>
        </svg>
        <img id="tv-album-art" class="tv-album-art hidden" src="" alt="Album art">
      </div>

      <!-- Track info -->
      <div id="tv-track-name" class="tv-track-name">---</div>
      <div id="tv-artist" class="tv-artist">---</div>

      <!-- Progress bar -->
      <div id="tv-progress" class="tv-progress">
        <div class="tv-progress-track">
          <div id="tv-progress-fill" class="tv-progress-fill"></div>
        </div>
        <div class="tv-progress-times">
          <span id="tv-elapsed" class="tv-time">0:00</span>
          <span id="tv-total" class="tv-time">0:00</span>
        </div>
      </div>

      <!-- Requester + dedication -->
      <div id="tv-requester" class="tv-requester hidden"></div>
      <div id="tv-dedication" class="tv-dedication hidden"></div>

      <!-- Reactions -->
      <div class="tv-reactions">
        <div id="tv-fire-wrap" class="tv-reaction">
          🔥 <span id="tv-fire-count" class="tv-reaction-count">0</span>
        </div>
        <div id="tv-heart-wrap" class="tv-reaction">
          ❤️ <span id="tv-heart-count" class="tv-reaction-count">0</span>
        </div>
      </div>

    </div>
  </div><!-- end tv-dash-now -->

  <!-- ── Center: Up Next queue ── -->
  <div class="tv-dash-next">
    <div class="tv-queue-title">COMING UP</div>
    <div id="tv-queue-list" class="tv-queue-list"></div>
  </div>

  <!-- ── Right: Leaderboards ── -->
  <div class="tv-dash-boards">
    <div class="tv-lb">
      <div class="tv-lb-title">🎧 Top DJs</div>
      <div id="tv-lb-djs" class="tv-lb-list"></div>
    </div>
    <div class="tv-lb">
      <div class="tv-lb-title">🔥 Crowd Favorites</div>
      <div id="tv-lb-favorites" class="tv-lb-list"></div>
    </div>
    <div class="tv-lb">
      <div class="tv-lb-title">⏭️ Most Skipped</div>
      <div id="tv-lb-skipped" class="tv-lb-list"></div>
    </div>
  </div>

  <!-- ── Bottom ticker ── -->
  <div class="tv-ticker">
    <div id="tv-ticker-inner" class="tv-ticker-inner">
      🎵 WELCOME TO THE PARTY JUKEBOX 🎵
    </div>
  </div>

</div><!-- end tv-dash -->

<script src="/static/js/tv.js"></script>
</body>
</html>
